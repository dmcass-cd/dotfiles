[tools]
dart = "latest"
flutter = "latest"
go = "latest"
java = "lts"
node = { version = "lts", postinstall = "npm install --global npm@latest" }
bun = "latest"
"npm:eslint" = "latest"
"npm:jest" = "latest"
"npm:prettier" = "latest"
"npm:react-devtools" = "latest"
"npm:typescript" = "latest"
"npm:yarn" = "latest"
"gem:cocoapods" = "latest"
"pipx:fb-idb" = "latest"
"pipx:pre-commit" = "latest"
"pipx:yubikey-manager" = "latest"
python = { version = "latest", postinstall = "python -m pip install boto3 pyyaml" }
ruby = "4.0.2"
rust = "stable"
usage = "latest"
pnpm = "latest"

[env]
# mise installs pnpm from package.json's packageManager; fail on a mismatch
# instead of letting pnpm download its own copy into ~/Library/pnpm/.tools.
pnpm_config_pm_on_fail = "error"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "pnpm"]
